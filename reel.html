<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Share and discover short videos on IQZodiac." />
  <title>Reels — IQZodiac</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=saved-items-20261112" />
  <link rel="stylesheet" href="./reel.css?v=saved-reels-20261112" />
</head>
<body class="reel-page">
  <main class="reel-shell" data-i18n-skip>
    <header class="reel-topbar" aria-label="Reels controls">
      <a class="reel-home-link" href="./home.html" aria-label="Back to IQZodiac"><span aria-hidden="true">←</span></a>
      <h1 id="reel-page-title" class="reel-page-title">Reels</h1>
      <div class="reel-topbar-actions">
        <a class="reel-stats-shortcut" href="./reel-stats.html" aria-label="My Reel statistics">
          <span class="reel-stats-icon" aria-hidden="true">▥</span>
          <span id="reel-stats-shortcut-label" class="reel-stats-shortcut-label">My Reel statistics</span>
        </a>
        <button id="reel-create-open" class="reel-create-open reel-create-trigger" type="button" aria-label="Create a Reel" aria-haspopup="dialog" aria-controls="reel-create-dialog">
          <span aria-hidden="true">＋</span><span id="reel-create-open-label">Create Reel</span>
        </button>
      </div>
    </header>

    <p id="reel-shared-warning" class="reel-shared-warning" role="status" hidden></p>
    <div id="reel-feed" class="reel-feed" role="region" tabindex="0" aria-label="Reels" aria-busy="true">
      <p class="reel-empty" id="reel-loading" role="status">Loading Reels…</p>
    </div>

    <dialog id="reel-create-dialog" class="reel-create-dialog" aria-labelledby="reel-create-title">
      <div class="reel-dialog-heading">
        <div><p class="card-kicker" id="reel-create-kicker">CREATE A REEL</p><h2 id="reel-create-title">Share a moment</h2></div>
        <button id="reel-create-close" class="reel-dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <p class="reel-create-note" id="reel-create-note">Choose a video up to six minutes and 50 MB. Add a caption, preview it, then publish.</p>
      <form id="reel-form" class="reel-form">
        <label for="reel-caption" id="reel-caption-label">Caption <span>(optional)</span></label>
        <textarea id="reel-caption" maxlength="280" rows="3" placeholder="What are you sharing?" aria-describedby="reel-caption-count"></textarea>
        <div class="reel-upload-row">
          <label class="reel-file-picker" for="reel-file"><span aria-hidden="true">＋</span><span id="reel-file-label">Choose a video</span><small id="reel-file-meta">MP4, WebM or MOV · up to 50 MB</small></label>
          <input id="reel-file" type="file" accept="video/*,.mp4,.webm,.mov,.m4v" hidden />
          <span id="reel-caption-count" class="reel-counter">0 / 280</span>
        </div>
        <div id="reel-preview" class="reel-preview" hidden></div>
        <p id="reel-form-status" class="reel-form-status" role="status" aria-live="polite"></p>
        <button id="publish-reel" class="button button-primary reel-publish-button" type="submit"><span id="publish-reel-label">Publish Reel</span><span class="button-arrow" aria-hidden="true">↗</span></button>
      </form>
    </dialog>
  </main>

  <nav class="site-nav" aria-label="Main navigation">
    <a href="./home.html"><span class="nav-glyph" aria-hidden="true">⌂</span><span data-menu-key="home">Home</span></a>
    <a href="./match.html"><span class="nav-glyph" aria-hidden="true">♡</span><span data-menu-key="match">Match</span></a>
    <a href="./daily.html"><span class="nav-glyph" aria-hidden="true">◌</span><span data-menu-key="daily">Daily</span></a>
    <a href="./discover.html"><span class="nav-glyph" aria-hidden="true">✦</span><span data-menu-key="discover">Discover</span></a>
    <a href="./reel.html" aria-current="page"><span class="nav-glyph" aria-hidden="true">◉</span><span data-menu-key="reel">Reel</span></a>
    <a href="./profile.html"><span class="nav-glyph" aria-hidden="true">◍</span><span data-menu-key="profile">Profile</span></a>
  </nav>
  <div class="toast" role="status" aria-live="polite" aria-atomic="true"><span class="toast-icon" aria-hidden="true">✦</span><span class="toast-message"></span></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>
  <script src="./auth-guard.js" defer></script>
  <script src="./auth-ui.js" defer></script>
  <script src="./i18n-data.js?v=20261107-reel" defer></script>
  <script src="./language.js?v=20261107-reel" defer></script>
  <script src="./saved-items.js?v=saved-items-20261112" defer></script>
  <script src="./reel.js?v=reel-saves-20261112" defer></script>
  <script src="./nav-performance.js" defer></script>
</body>
</html>
