<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#52645b" />
    <title>City Life — حياة المدينة</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/ManusCC0-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./fonts/ManusCC0-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      #city-boot{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#15221e;color:#e5eee8;transition:opacity .35s,visibility .35s}
      #city-boot.is-hidden{opacity:0;visibility:hidden;pointer-events:none}.city-boot-content{width:min(24rem,calc(100vw - 48px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
      .city-boot-content img{width:76px;height:76px;object-fit:contain}.city-boot-title{font:700 1.4rem system-ui;direction:ltr}.city-boot-status{font:500 .92rem system-ui}
      .city-boot-track{height:5px;width:100%;overflow:hidden;border-radius:99px;background:#3c5148}.city-boot-progress{height:100%;width:38%;border-radius:99px;background:#9ccdb9;animation:city-boot-run 1.1s ease-in-out infinite alternate}
      @keyframes city-boot-run{from{transform:translateX(-35%)}to{transform:translateX(195%)}}.city-boot-retry{border:1px solid #9ccdb9;border-radius:8px;padding:9px 16px;background:transparent;color:inherit;font:inherit;cursor:pointer}
      @media(prefers-reduced-motion:reduce){.city-boot-progress{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="city-boot" role="status" aria-live="polite">
      <div class="city-boot-content">
        <img src="./favicon.svg" alt="" width="76" height="76" />
        <strong class="city-boot-title">City Life</strong>
        <span id="city-boot-status" class="city-boot-status">جارٍ تهيئة المدينة…</span>
        <div class="city-boot-track" role="progressbar" aria-label="جارٍ التحميل"><div class="city-boot-progress"></div></div>
        <button id="city-boot-retry" class="city-boot-retry" type="button" hidden>إعادة المحاولة</button>
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script>
      (()=>{const boot=document.getElementById('city-boot');const status=document.getElementById('city-boot-status');const retry=document.getElementById('city-boot-retry');if(!boot||!status||!retry)return;let timer;const showError=()=>{if(boot.classList.contains('is-hidden'))return;clearTimeout(timer);status.textContent='تعذّر تحميل المدينة. يمكنك إعادة المحاولة.';retry.hidden=false};const ready=()=>{clearTimeout(timer);window.removeEventListener('error',showError);window.removeEventListener('unhandledrejection',showError);window.removeEventListener('citylife-error',showError);setTimeout(()=>boot.classList.add('is-hidden'),220)};retry.addEventListener('click',()=>location.reload());window.addEventListener('citylife-ready',ready,{once:true});window.addEventListener('citylife-error',showError);window.addEventListener('error',showError,{once:true});window.addEventListener('unhandledrejection',showError,{once:true});timer=setTimeout(showError,20000)})();
    </script>
    <script type="module" src="/src/city-main.ts"></script>
  </body>
</html>
