<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>تعيين كلمة مرور جديدة — IQZodiac</title>
  <link rel="stylesheet" href="./styles.css?v=password-recovery-20261128" />
  <style>
    .recovery-shell { width: min(100% - 28px, 560px); margin: 7vh auto; position: relative; z-index: 1; }
    .recovery-card { padding: clamp(22px, 5vw, 42px); border: 1px solid rgba(218,225,255,.14); border-radius: 16px; background: rgba(16,23,45,.94); color: #f2f6fc; box-shadow: 0 24px 90px rgba(0,0,0,.4); }
    .recovery-card h1 { margin: 0 0 10px; font-size: clamp(27px, 6vw, 42px); }
    .recovery-card p { color: #aab4c2; line-height: 1.8; }
    .recovery-fields { display: grid; gap: 14px; margin: 25px 0 15px; }
    .recovery-fields label { display: grid; gap: 7px; }
    .recovery-fields input { min-height: 46px; padding: 10px 12px; direction: ltr; text-align: left; color: #fff; background: #10172d; border: 1px solid rgba(218,225,255,.2); border-radius: 8px; font: inherit; }
    .recovery-status { min-height: 26px; color: #aab4c2; line-height: 1.7; }
    .recovery-status[data-error="true"] { color: #ff9d9d; }
    .recovery-link { display: inline-block; margin-top: 12px; color: #83e5e8; }
    #recovery-form[hidden], #recovery-invalid[hidden], #recovery-success[hidden] { display: none; }
  </style>
</head>
<body class="signup-page">
  <div class="aurora aurora-one" aria-hidden="true"></div><div class="aurora aurora-two" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
  <main class="recovery-shell"><section class="recovery-card">
    <p class="eyebrow">IQZODIAC · أمان الحساب</p>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p>اختر كلمة مرور جديدة لحسابك. لا تشارك رابط الاستعادة أو كلمة المرور مع أي شخص.</p>
    <div id="recovery-invalid" class="recovery-status" role="alert">رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة استعادة جديدة.</div>
    <form id="recovery-form" hidden>
      <div class="recovery-fields"><label>كلمة المرور الجديدة<input id="new-password" type="password" autocomplete="new-password" minlength="8" required /></label><label>تأكيد كلمة المرور<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required /></label></div>
      <p id="recovery-status" class="recovery-status" aria-live="polite"></p>
      <button id="recovery-submit" class="button button-primary" type="submit">حفظ كلمة المرور</button>
    </form>
    <div id="recovery-success" hidden><p>تم تحديث كلمة المرور. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.</p><a class="recovery-link" href="./login.html">الانتقال إلى تسجيل الدخول</a></div>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-client.js?v=password-recovery-20261128"></script><script src="./account-password-recovery.js?v=password-recovery-20261128"></script>
</body>
</html>
