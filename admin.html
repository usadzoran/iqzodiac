<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Private administration — IQZodiac</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=admin-20261101" />
  <style>
    .admin-shell{position:relative;z-index:1;width:min(100% - 34px,1100px);min-height:100vh;margin:auto;padding:30px 0 110px}.admin-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px}.admin-header h1{margin:0;font-size:clamp(32px,5vw,60px);letter-spacing:-.08em}.admin-header h1 span{color:var(--cyan)}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admin-card{padding:22px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(145deg,rgba(24,31,57,.8),rgba(12,17,32,.76));box-shadow:0 20px 70px #0003}.admin-card h2{margin:0;font-size:18px}.admin-value{display:block;margin-top:18px;color:var(--cyan);font-size:38px;letter-spacing:-.08em}.admin-table{width:100%;margin-top:22px;border-collapse:collapse;font-size:11px}.admin-table th,.admin-table td{padding:11px 8px;border-bottom:1px solid #fff1;text-align:left}.admin-table th{color:var(--dim);font:8px "DM Mono",monospace;text-transform:uppercase}.admin-status{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.7}.admin-error{padding:30px;border:1px solid #f2a77c66;color:var(--orange);font-size:13px}.admin-wide{grid-column:1/-1}@media(max-width:700px){.admin-header{display:block}.admin-grid{grid-template-columns:1fr}.admin-wide{grid-column:auto}.admin-table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body>
  <div class="aurora aurora-one" aria-hidden="true"></div><div class="aurora aurora-two" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
  <main class="admin-shell"><header class="admin-header"><div><p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span> PRIVATE CONTROL ROOM</p><h1>IQZodiac <span>admin.</span></h1></div><a class="back-link" href="./home.html">Return to site ↗</a></header>
    <section id="admin-loading" class="admin-card"><p class="loading-pulse">Verifying access…</p></section>
    <section id="admin-content" hidden><div class="admin-grid"><article class="admin-card"><p class="card-kicker">MEMBERS</p><h2>Registered profiles</h2><strong id="member-count" class="admin-value">—</strong></article><article class="admin-card"><p class="card-kicker">MEDIA</p><h2>Stored profile media</h2><strong id="media-count-admin" class="admin-value">—</strong></article><article class="admin-card"><p class="card-kicker">ACCESS</p><h2>Owner verification</h2><strong class="admin-value">ACTIVE</strong></article><article class="admin-card admin-wide"><p class="card-kicker">RECENT ACCOUNTS</p><h2>Latest profiles</h2><div id="profiles-table"><p class="admin-status">Loading protected records…</p></div></article></div></section>
    <section id="admin-error" class="admin-error" hidden></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script><script src="./admin.js"></script>
</body></html>
